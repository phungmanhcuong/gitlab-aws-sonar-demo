# Build once on main, promote the same image: staging on every main pipeline, production on a vX.Y.Z tag.
# The image is tagged with the commit SHA in an ECR repository whose tags cannot be overwritten, so a tag
# pipeline deploys exactly the bytes that main built, scanned and tested.

# The shared stack (ECR repository) must exist before the first push.
infra-shared:
  extends: [.terraform, .aws, .rules:main-aws]
  stage: build
  needs: [terraform-checks]
  resource_group: aws-shared
  variables:
    AWS_ROLE_ARN: $ROLE_ARN_STAGING
  script:
    - !reference [.aws-token, script]
    - !reference [.tf-init, script]
    - tf_init shared shared.tfstate
    - terraform -chdir=infra/stacks/shared apply -auto-approve

# Built on GitLab's Arm runner: Lambda runs arm64. No AWS access here.
build-image:
  extends: .rules:main
  stage: build
  needs: [lint, unit-test]
  tags: [saas-linux-small-arm64]
  image: docker:29.9.3
  services: [docker:29.9.3-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    # Lambda accepts a single image manifest: no provenance or SBOM attestations in the image index.
    - docker build --pull --provenance=false --sbom=false --platform linux/arm64
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
        --label org.opencontainers.image.source="$CI_PROJECT_URL"
        -t "$APP_NAME:$CI_COMMIT_SHA" app
    - docker save "$APP_NAME:$CI_COMMIT_SHA" -o image.tar
    - ls -lh image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

scan-image:
  extends: [.trivy, .rules:main]
  stage: build
  needs: [build-image]
  script:
    - trivy image --input image.tar --format cyclonedx --output sbom.cdx.json
    - trivy image --input image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
  artifacts:
    when: always
    expire_in: 30 days
    paths: [sbom.cdx.json]

push-image:
  extends: [.aws, .rules:main-aws]
  stage: build
  needs: [build-image, scan-image, infra-shared]
  image: docker:29.9.3
  services: [docker:29.9.3-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
    AWS_ROLE_ARN: $ROLE_ARN_STAGING
  script:
    - apk add --no-cache aws-cli
    - !reference [.aws-token, script]
    - |
      if aws ecr describe-images --repository-name "$APP_NAME" --image-ids "imageTag=$CI_COMMIT_SHA" >/dev/null 2>&1; then
        echo "$IMAGE_REPO:$CI_COMMIT_SHA is already in ECR (tags are immutable): nothing to push"; exit 0
      fi
    - docker load -i image.tar
    - aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE_REPO%%/*}"
    - docker tag "$APP_NAME:$CI_COMMIT_SHA" "$IMAGE_REPO:$CI_COMMIT_SHA"
    - docker push "$IMAGE_REPO:$CI_COMMIT_SHA"

# deploy <env>: Terraform resolves image_tag to its digest in ECR and points the Lambda alias "live" at a new
# version. GitLab's "Re-deploy" on an older deploy job is the rollback: it applies that job's commit again.
.deploy:
  extends: [.terraform, .aws]
  script:
    - !reference [.aws-token, script]
    - !reference [.tf-init, script]
    - tf_init service "service/$DEPLOY_ENV.tfstate"
    - terraform -chdir=infra/stacks/service apply -auto-approve -var-file="envs/$DEPLOY_ENV.tfvars" -var "image_tag=$CI_COMMIT_SHA"
    - echo "DYNAMIC_ENVIRONMENT_URL=$(terraform -chdir=infra/stacks/service output -raw api_url)" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

.smoke:
  extends: .python
  script:
    - python3 scripts/smoke.py "$DYNAMIC_ENVIRONMENT_URL" --version "$CI_COMMIT_SHA"

deploy-staging:
  extends: [.deploy, .rules:main-aws]
  stage: staging
  needs:
    - push-image
    - security-gate
    - dependency-scan
    - iac-scan
    - job: sonarqube
      optional: true
  resource_group: staging
  interruptible: false
  variables:
    DEPLOY_ENV: staging
    AWS_ROLE_ARN: $ROLE_ARN_STAGING
  environment:
    name: staging
    url: $DYNAMIC_ENVIRONMENT_URL
    deployment_tier: staging

smoke-staging:
  extends: [.smoke, .rules:main-aws]
  stage: staging
  needs: [deploy-staging]

deploy-production:
  extends: .deploy
  stage: production
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $ROLE_ARN_PRODUCTION
      when: manual
  resource_group: production
  interruptible: false
  variables:
    DEPLOY_ENV: production
    AWS_ROLE_ARN: $ROLE_ARN_PRODUCTION
  environment:
    name: production
    url: $DYNAMIC_ENVIRONMENT_URL
    deployment_tier: production

smoke-production:
  extends: [.smoke, .rules:release-tag]
  stage: production
  needs: [deploy-production]

release:
  extends: .rules:release-tag
  stage: production
  needs: [smoke-production]
  image: registry.gitlab.com/gitlab-org/cli:v1.130.0
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "Deployed to production: image $IMAGE_REPO:$CI_COMMIT_SHA"

# Manual teardown. Staging and the ECR repository from main; production from a tag pipeline (only tags may use
# the production role).
destroy-staging:
  extends: [.terraform, .aws]
  stage: staging
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ROLE_ARN_STAGING
      when: manual
      allow_failure: true
  resource_group: staging
  variables:
    AWS_ROLE_ARN: $ROLE_ARN_STAGING
  environment:
    name: staging
    action: stop
  script:
    - !reference [.aws-token, script]
    - !reference [.tf-init, script]
    - tf_init service service/staging.tfstate
    - TAG=$(terraform -chdir=infra/stacks/service output -raw image_tag)
    - terraform -chdir=infra/stacks/service destroy -auto-approve -var-file=envs/staging.tfvars -var "image_tag=$TAG"

destroy-production:
  extends: [.terraform, .aws]
  stage: production
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $ROLE_ARN_PRODUCTION
      when: manual
      allow_failure: true
  resource_group: production
  variables:
    AWS_ROLE_ARN: $ROLE_ARN_PRODUCTION
  environment:
    name: production
    action: stop
  script:
    - !reference [.aws-token, script]
    - !reference [.tf-init, script]
    - tf_init service service/production.tfstate
    - TAG=$(terraform -chdir=infra/stacks/service output -raw image_tag)
    # The production table refuses deletion: switch that off first, then destroy.
    - terraform -chdir=infra/stacks/service apply -auto-approve -var-file=envs/production.tfvars -var "image_tag=$TAG" -var deletion_protection=false
    - terraform -chdir=infra/stacks/service destroy -auto-approve -var-file=envs/production.tfvars -var "image_tag=$TAG" -var deletion_protection=false

destroy-shared:
  extends: [.terraform, .aws]
  stage: staging
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ROLE_ARN_STAGING
      when: manual
      allow_failure: true
  resource_group: aws-shared
  variables:
    AWS_ROLE_ARN: $ROLE_ARN_STAGING
  script:
    - !reference [.aws-token, script]
    - !reference [.tf-init, script]
    - tf_init shared shared.tfstate
    - terraform -chdir=infra/stacks/shared destroy -auto-approve
