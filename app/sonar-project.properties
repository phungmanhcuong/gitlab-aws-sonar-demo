# SonarQube analysis settings, read by pysonar (run from app/ in the sonarqube CI job).
sonar.projectKey=gitlab-aws-sonar-demo
sonar.projectName=shortlinks
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=report.xml
