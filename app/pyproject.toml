[project]
name = "shortlinks"
version = "0.1.0"
description = "Small link-shortener API used to teach GitLab CI, SonarQube and AWS delivery"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "boto3==1.44.0",
    "python-multipart==0.0.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "moto[dynamodb]==5.2.5",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "boto3-stubs[dynamodb]==1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortlinks"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=shortlinks --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=report.xml"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]
